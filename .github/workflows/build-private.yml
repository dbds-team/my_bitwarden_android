name: Build Private Android

on:
  push:
    branches:
      - build-private
  workflow_dispatch:
    inputs:
      version-name:
        description: "Optional. Version string to use, in X.Y.Z format. Overrides default in the project."
        required: false
        type: string
      version-code:
        description: "Optional. Build number to use. Overrides default of GitHub run number."
        required: false
        type: number

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_VERSION: 17

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-cache
          key: ${{ runner.os }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install bundler:2.2.27
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Setup signing keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          mkdir -p ${{ github.workspace }}/keystores
          echo "$KEY_JKS" | base64 -d > ${{ github.workspace }}/keystores/release-keystore.jks

      - name: Update app CI Build info
        run: |
          ./scripts/update_app_ci_build_info.sh \
          $GITHUB_REPOSITORY \
          $GITHUB_REF_NAME \
          $GITHUB_SHA \
          $GITHUB_RUN_ID \
          $GITHUB_RUN_ATTEMPT

      - name: Increment version
        run: |
          DEFAULT_VERSION_CODE=$((11000+GITHUB_RUN_NUMBER))
          bundle exec fastlane setBuildVersionInfo \
          versionCode:${{ inputs.version-code || '$DEFAULT_VERSION_CODE' }} \
          versionName:${{ inputs.version-name }}

      - name: Build release APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          bundle exec fastlane assembleStandardReleaseApk \
          storeFile:release-keystore.jks \
          storePassword:${{ env.ANDROID_STORE_PASSWORD }} \
          keyAlias:${{ env.ALIAS }} \
          keyPassword:${{ env.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.x8bit.bitwarden-release.apk
          path: app/build/outputs/apk/standard/release/com.x8bit.bitwarden.apk
          if-no-files-found: error

      - name: Create checksum for release artifact
        run: |
          sha256sum "app/build/outputs/apk/standard/release/com.x8bit.bitwarden.apk" \
            > ./com.x8bit.bitwarden-release.apk-sha256.txt

      - name: Upload checksum file
        uses: actions/upload-artifact@v4
        with:
          name: com.x8bit.bitwarden-release.apk-sha256.txt
          path: ./com.x8bit.bitwarden-release.apk-sha256.txt
          if-no-files-found: error