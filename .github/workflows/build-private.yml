name: Build Android APK

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 需要 write 权限来创建 Release
      packages: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Modify dependencies to avoid private packages
        run: |
          # First, let's see what we're working with
          echo "=== Original settings.gradle.kts repositories ==="
          grep -A 15 "repositories {" settings.gradle.kts || true
          
          # Replace GitHub Packages repository with empty string (safer than deletion)
          # This preserves the repository structure
          sed -i 's|maven {[^}]*github\.com/bitwarden/sdk[^}]*}|// GitHub Packages removed|g' settings.gradle.kts
          
          # Alternative approach: comment out the problematic maven block
          sed -i '/maven.*{/,/^[[:space:]]*}/ {
            /github\.com\/bitwarden/,/}/ s/^/\/\/ /
          }' settings.gradle.kts
          
          # Fix any maven blocks with missing URL
          sed -i '/maven[[:space:]]*{[[:space:]]*$/,/^[[:space:]]*}/ {
            /url[[:space:]]*=/! {
              /maven[[:space:]]*{/ a\        url = uri("https://repo.maven.apache.org/maven2/")
            }
          }' settings.gradle.kts
          
          # Comment out SDK dependency in version catalog
          sed -i 's/bitwarden-sdk = .*/# &/' gradle/libs.versions.toml
          
          # Comment out SDK implementation in build files
          find . -name "*.gradle.kts" -exec sed -i 's/.*bitwarden-sdk.*/\/\/ &/' {} \;
          
          echo "=== Modified settings.gradle.kts repositories ==="
          grep -A 15 "repositories {" settings.gradle.kts || true
          
          # Validate that we have required repositories
          echo "=== Validating repositories ==="
          if grep -q "google()" settings.gradle.kts && grep -q "mavenCentral()" settings.gradle.kts; then
            echo "✅ Standard repositories found"
          else
            echo "⚠️ Warning: Standard repositories might be missing"
          fi
      
      - name: Setup keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          mkdir -p keystores
          echo "$KEY_JKS" | base64 -d > keystores/release.jks
      
      - name: Build signed Release APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease \
            -Pandroid.injected.signing.store.file=../../keystores/release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-android-release-apk  
          path: app/build/outputs/apk/standard/release/*.apk
      
      - name: Generate version info
        id: version
        run: |
          VERSION="v$(date +%Y%m%d.%H%M)-$(echo $GITHUB_SHA | head -c 7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
          
          # Get APK info
          APK_PATH=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bitwarden Android ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Bitwarden Android Release ${{ steps.version.outputs.tag }}
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `build-private`
            **APK Size:** ${{ steps.version.outputs.apk_size }}
            
            ### ✨ Features
            - ✅ **100% Open Source Build** - No private dependencies
            - ✅ **Custom Signed** - Signed with your own keystore
            - ✅ **No Telemetry** - Privacy-focused build
            - 🔐 **Standard Edition** - Full features without premium restrictions
            
            ### 📱 Installation
            
            1. **Enable Unknown Sources:**
               - Settings → Security → Unknown sources (Enable)
            
            2. **Download and Install:**
               - Download the APK file below
               - Open the downloaded file
               - Follow installation prompts
            
            3. **Verify Signature** (Optional):
               ```bash
               apksigner verify --verbose bitwarden-*.apk
               ```
            
            ### ⚠️ Important Notes
            - This APK won't auto-update from Play Store
            - Backup your vault before installing
            - Built without Bitwarden SDK (some features may be limited)
            
            ### 🔄 Update Instructions
            Download new releases from this repository and install over existing app.
          files: |
            app/build/outputs/apk/standard/release/*.apk