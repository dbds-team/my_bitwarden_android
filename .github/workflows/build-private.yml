name: Build Android APK

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Setup keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          mkdir -p keystores
          echo "$KEY_JKS" | base64 -d > keystores/release.jks
      
      - name: Build signed APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease \
            -Pandroid.injected.signing.store.file=../../keystores/release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-android-apk
          path: app/build/outputs/apk/standard/release/*.apk