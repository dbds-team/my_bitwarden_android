name: Build Android with Custom SDK

on:
  push:
    branches: [build-private]
  workflow_dispatch:

jobs:
  build-sdk:
    name: Build Android SDK from Source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: dbds-team/my_sdk-internal
          path: sdk-internal
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Add Android targets to Rust
        run: |
          echo "Adding Android targets to Rust toolchain..."
          
          # Install Android targets
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi  
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          
          # Verify Rust installation
          echo "Rust version:"
          rustc --version
          echo ""
          echo "Rustup toolchains:"
          rustup toolchain list
          echo ""
          echo "✅ Android targets added successfully"
          rustup target list --installed | grep android
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: 26.3.11579264
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-internal -> target
      
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
      
      - name: Build Rust library for Android
        working-directory: sdk-internal
        run: |
          # Set Android NDK environment variables
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export NDK_HOME=$ANDROID_NDK_HOME
          
          # Verify NDK installation
          echo "Android NDK location: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME" || echo "NDK directory not found"
          
          # Set up linker paths for Android targets
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          export CXX_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++
          export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          export CC_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi33-clang
          export CXX_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi33-clang++
          export AR_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          export CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang  
          export CXX_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang++
          export AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          export CC_i686_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android33-clang
          export CXX_i686_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android33-clang++
          export AR_i686_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          # Verify that Rust targets are installed
          echo "Installed Rust targets:"
          rustup target list --installed | grep android
          
          # First, build the uniffi library for the host (needed for code generation)
          echo "Building uniffi library for host..."
          cargo build --release -p bitwarden-uniffi
          
          # Build for all Android architectures using cargo-ndk
          echo "Building for Android architectures..."
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -t i686-linux-android \
            -o crates/bitwarden-uniffi/kotlin/sdk/src/main/jniLibs \
            build --release -p bitwarden-uniffi
          
          echo "✅ Rust library built successfully"
          ls -la crates/bitwarden-uniffi/kotlin/sdk/src/main/jniLibs/
      
      - name: Generate Kotlin bindings
        working-directory: sdk-internal
        run: |
          # Generate Kotlin bindings using uniffi-bindgen-kotlin
          cargo run -p uniffi-bindgen-kotlin
          
          # The bindings should be generated in the right place by the build script
          echo "✅ Kotlin bindings generated"
          find crates/bitwarden-uniffi/kotlin -name "*.kt" | head -20
          ls -la crates/bitwarden-uniffi/kotlin/sdk/src/main/java/com/bitwarden/sdk/ || true
      
      - name: Build Android SDK library
        working-directory: sdk-internal/crates/bitwarden-uniffi/kotlin
        run: |
          # Set version to LOCAL for consistency
          echo "VERSION=LOCAL" >> $GITHUB_ENV
          
          # Build the Android library (AAR)
          ./gradlew :sdk:assembleRelease -Pversion=LOCAL
          
          echo "✅ Android SDK built successfully"
          ls -la sdk/build/outputs/aar/
      
      - name: Publish to local Maven repository
        working-directory: sdk-internal/crates/bitwarden-uniffi/kotlin
        run: |
          # Modify publishing configuration to use local repository only
          cat >> sdk/build.gradle << 'EOF'
          
          // Override publishing for local build
          afterEvaluate {
              publishing {
                  publications {
                      maven {
                          groupId = 'com.bitwarden'
                          artifactId = 'sdk-android'
                          version = 'LOCAL'
                      }
                  }
                  repositories {
                      mavenLocal()
                  }
              }
          }
          EOF
          
          # Publish to local Maven repository
          ./gradlew :sdk:publishToMavenLocal -Pversion=LOCAL
          
          echo "✅ SDK published to local Maven repository"
          ls -la ~/.m2/repository/com/bitwarden/sdk-android/LOCAL/ || true
      
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitwarden-sdk-android
          path: |
            sdk-internal/crates/bitwarden-uniffi/kotlin/sdk/build/outputs/aar/*.aar
            ~/.m2/repository/com/bitwarden/sdk-android/

  build-android:
    needs: build-sdk
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: bitwarden-sdk-android
          path: sdk-artifact
      
      - name: Setup local Maven repository with SDK
        run: |
          # Ensure the Maven repository structure exists
          mkdir -p ~/.m2/repository/com/bitwarden/sdk-android/LOCAL/
          
          # Copy SDK artifacts to local Maven repository
          if [ -d "sdk-artifact/com/bitwarden/sdk-android" ]; then
            cp -r sdk-artifact/com/bitwarden/sdk-android/* ~/.m2/repository/com/bitwarden/sdk-android/
          fi
          
          # Also copy AAR files if they exist
          if ls sdk-artifact/*.aar 1> /dev/null 2>&1; then
            AAR_FILE=$(ls sdk-artifact/*.aar | head -1)
            cp "$AAR_FILE" ~/.m2/repository/com/bitwarden/sdk-android/LOCAL/sdk-android-LOCAL.aar
            
            # Create a basic POM file
            cat > ~/.m2/repository/com/bitwarden/sdk-android/LOCAL/sdk-android-LOCAL.pom << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.bitwarden</groupId>
            <artifactId>sdk-android</artifactId>
            <version>LOCAL</version>
            <packaging>aar</packaging>
          </project>
          EOF
          fi
          
          echo "✅ SDK installed to local Maven repository"
          ls -la ~/.m2/repository/com/bitwarden/sdk-android/LOCAL/ || true
      
      - name: Modify build to use local SDK
        run: |
          # Add mavenLocal() to repositories
          sed -i '/repositories {/a\        mavenLocal()' settings.gradle.kts
          
          # Replace SDK dependency version with LOCAL
          sed -i 's/bitwarden-sdk = .*/bitwarden-sdk = "LOCAL"/' gradle/libs.versions.toml
          
          # Remove GitHub Packages repository that requires authentication
          sed -i '/maven.*github\.com\/bitwarden\/sdk/,/}/d' settings.gradle.kts
          
          echo "✅ Build configuration modified to use local SDK"
      
      - name: Handle Google Services
        run: |
          # Create a placeholder google-services.json
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "bitwarden-placeholder",
              "storage_bucket": "bitwarden-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.x8bit.bitwarden"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyPlaceholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          
          echo "✅ Google Services configured"
      
      - name: Setup keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          # Create keystore from secret
          echo "$KEY_JKS" | base64 -d > $PWD/release.jks
          echo "✅ Keystore created at: $PWD/release.jks"
          ls -la $PWD/release.jks
      
      - name: Build signed Release APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$PWD/release.jks"
          echo "🔨 Building Android app with custom SDK..."
          
          ./gradlew assembleStandardRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          
          echo "✅ APK built successfully"
          ls -la app/build/outputs/apk/standard/release/
      
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-android-apk
          path: app/build/outputs/apk/standard/release/*.apk
      
      - name: Generate version info
        id: version
        run: |
          VERSION="v$(date +%Y%m%d.%H%M)-$(echo $GITHUB_SHA | head -c 7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
          
          # Get APK info
          APK_PATH=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bitwarden Android (Custom SDK) ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Bitwarden Android Release ${{ steps.version.outputs.tag }}
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `build-private`
            **APK Size:** ${{ steps.version.outputs.apk_size }}
            
            ### ✨ Features
            - ✅ **100% Open Source Build** - SDK built from source
            - ✅ **Custom SDK** - Built from [dbds-team/my_sdk-internal](https://github.com/dbds-team/my_sdk-internal)
            - ✅ **Custom Signed** - Signed with your own keystore
            - ✅ **No Telemetry** - Privacy-focused build
            - 🔐 **Standard Edition** - Full features
            
            ### 📱 Installation
            
            1. **Enable Unknown Sources:**
               - Settings → Security → Unknown sources (Enable)
            
            2. **Download and Install:**
               - Download the APK file below
               - Open the downloaded file
               - Follow installation prompts
            
            3. **Verify Signature** (Optional):
               ```bash
               apksigner verify --verbose bitwarden-*.apk
               ```
            
            ### ⚠️ Important Notes
            - This APK won't auto-update from Play Store
            - Backup your vault before installing
            - Built with custom open-source SDK
            
            ### 🔄 Update Instructions
            Download new releases from this repository and install over existing app.
          files: |
            app/build/outputs/apk/standard/release/*.apk